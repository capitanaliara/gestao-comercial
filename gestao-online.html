<body><div class="app"><aside class="side"><div class="side-head"><div class="brand"><span class="brand-name">Gestão Local</span><small>COMERCIAL · OFFLINE</small></div><button id="sideToggle" class="side-toggle" type="button" aria-label="Recolher menu" title="Recolher menu">‹</button></div><button class="side-quick" type="button" id="quickTask" title="Nova tarefa"><span class="side-icon">＋</span><span class="side-label">Nova tarefa</span></button><nav class="nav" id="nav" aria-label="Navegação principal"></nav><div class="sidefoot">Seus dados ficam neste navegador. Exporte backups regularmente em Configurações.</div></aside><main class="main"><header><div><div class="eyebrow" id="subtitle">Visão geral</div><h1 id="title">Painel</h1></div><div id="headerActions"></div></header><div id="content"></div></main></div><div id="modalRoot"></div><div id="printRoot" class="printonly"></div><script>
(()=>{'use strict';
const KEY='gestao-local-v1';const ONLINE_CONFIG={url:'https://xmzfzmerdehpejepbfon.supabase.co',anonKey:'sb_publishable_fX13mIAAfmhe-aeqFjIrKQ_SxkQ6sGZ'};const sections={dashboard:'Painel',clients:'Contatos',services:'Serviços',proposals:'Propostas',deals:'Prospecção',projects:'Projetos',meetings:'Análise de reuniões',emails:'E-mails',receipts:'Recebimentos',settings:'Configurações'};
let compactSidebar=false;try{compactSidebar=localStorage.getItem('gestao-sidebar-compact')==='1'}catch{};let db=load(),section='dashboard',query='',printing=null;
function fresh(){return {version:1,company:{name:'Dayana Araújo',document:'',email:'',phone:'',address:'',pix:''},clients:[],services:[],proposals:[],deals:[],projects:[],meetings:[],receipts:[],tasks:[],contactLists:[],emailChecks:[],emailJobs:[],goals:{monthlyRevenue:3300,monthlyLeads:20,weeklyTasks:10}}}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(valid(x)){x.projects??=[];x.meetings??=[];x.tasks??=[];x.contactLists??=[];x.emailChecks??=[];x.emailJobs??=[];x.goals??={monthlyRevenue:3300,monthlyLeads:20,weeklyTasks:10};if(!x.demo&&["clients","services","proposals","deals","projects","meetings","receipts","tasks","contactLists","emailChecks","emailJobs"].every(k=>!x[k]?.length))return demoData();return x}return demoData()}catch{return demoData()}}
function valid(x){return x&&x.version===1&&x.company&&['clients','services','proposals','deals','receipts'].every(k=>Array.isArray(x[k]))&&(!x.projects||Array.isArray(x.projects))&&(!x.meetings||Array.isArray(x.meetings))&&(!x.tasks||Array.isArray(x.tasks))&&(!x.contactLists||Array.isArray(x.contactLists))&&(!x.emailChecks||Array.isArray(x.emailChecks))&&(!x.emailJobs||Array.isArray(x.emailJobs))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch{alert('Não foi possível salvar. O armazenamento do navegador pode estar cheio ou bloqueado. Exporte um backup e libere espaço.');return false}}
const id=()=>globalThis.crypto?.randomUUID?.()||('id-'+Date.now()+'-'+Math.random().toString(36).slice(2));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const date=s=>s?new Date(s+'T12:00:00').toLocaleDateString('pt-BR'):'—';
const today=()=>new Date().toLocaleDateString('en-CA');
const num=n=>Number.parseFloat(String(n??'').replace(',','.'))||0;
function notify(s){let el=document.createElement('div');el.className='toast';el.textContent=s;document.body.append(el);setTimeout(()=>el.remove(),3000)}
function field(name,label,value='',type='text',extra=''){return `<div class="field ${extra}"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${type==='number'?'min="0" step="0.01"':''}></div>`}

function select(name,label,opts,value='',extra=''){return `<div class="field ${extra}"><label>${label}</label><select name="${name}">${opts.map(([v,t])=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`}
const attrs=(form)=>Object.fromEntries(new FormData(form));
function modal(title,html,onSubmit){document.getElementById('modalRoot').innerHTML=`<div class="modalback"><div class="modal"><div class="modalhead"><h2>${esc(title)}</h2><button class="close" type="button" data-close>✕</button></div><form id="editor">${html}<div class="row" style="justify-content:flex-end;margin-top:22px"><button type="button" class="btn" data-close>Cancelar</button><button class="btn primary" type="submit">Salvar</button></div></form></div></div>`;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);document.querySelector('.modalback').onclick=e=>{if(e.target.classList.contains('modalback'))closeModal()};document.getElementById('editor').onsubmit=e=>{e.preventDefault();onSubmit(e.target)}}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function upsert(key,obj){let i=db[key].findIndex(x=>x.id===obj.id);if(i<0)db[key].push(obj);else db[key][i]=obj;if(save()){closeModal();render();notify('Salvo com sucesso.')}}
function remove(key,uid){let obj=db[key].find(x=>x.id===uid);if(!obj)return;if(key==='clients'&&(db.proposals.some(p=>p.clientId===uid)||db.deals.some(d=>d.clientId===uid)||db.projects.some(p=>p.clientId===uid)||db.meetings.some(m=>m.clientId===uid)))return alert('Cliente usado em proposta ou negociação. Remova os vínculos antes.');if(key==='proposals'&&(db.deals.some(d=>d.proposalId===uid)||db.receipts.some(r=>r.proposalId===uid)||db.projects.some(p=>p.proposalId===uid)))return alert('Proposta vinculada a negociação ou recebimento. Remova os vínculos antes.');if(!confirm('Excluir este registro? Essa ação não pode ser desfeita sem um backup.'))return;db[key]=db[key].filter(x=>x.id!==uid);save();render()}
function nameClient(uid){return db.clients.find(x=>x.id===uid)?.name||'Cliente removido'}
function proposal(uid){return db.proposals.find(x=>x.id===uid)}
function ptotal(p){return (p.items||[]).reduce((a,x)=>a+num(x.quantity)*num(x.price),0)}
function remaining(p){return Math.max(0,ptotal(p)-db.receipts.filter(r=>r.proposalId===p.id&&r.paidAt).reduce((a,r)=>a+num(r.amount),0))}
function render(){document.querySelector('.app').classList.toggle('sidebar-compact',compactSidebar);let icons={dashboard:'⌂',clients:'♙',services:'▦',proposals:'▤',deals:'◎',projects:'◈',meetings:'◉',emails:'✉',receipts:'◫',settings:'⚙'};document.getElementById('nav').innerHTML=Object.entries(sections).map(([k,v])=>`<button data-section="${k}" class="${k===section?'active':''}" title="${esc(v)}" aria-label="${esc(v)}"><span class="side-icon" aria-hidden="true">${icons[k]}</span><span class="side-label">${esc(v)}</span></button>`).join('');let toggle=document.getElementById('sideToggle');toggle.textContent=compactSidebar?'›':'‹';toggle.setAttribute('aria-label',compactSidebar?'Expandir menu':'Recolher menu');toggle.title=compactSidebar?'Expandir menu':'Recolher menu';toggle.onclick=()=>{compactSidebar=!compactSidebar;try{localStorage.setItem('gestao-sidebar-compact',compactSidebar?'1':'0')}catch{};render()};document.getElementById('quickTask').onclick=()=>taskEditor();document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{section=b.dataset.section;query='';render()});document.getElementById('title').textContent=sections[section];document.getElementById('subtitle').textContent=section==='dashboard'?'Seu negócio em um só lugar':'Gestão comercial';document.getElementById('headerActions').innerHTML=({clients:'<button class="btn primary" data-new="clients">+ Cliente</button>',services:'<button class="btn primary" data-new="services">+ Serviço</button>',proposals:'<button class="btn primary" data-new="proposals">+ Proposta</button>',deals:'<button class="btn primary" data-new="deals">+ Lead</button>',projects:'<button class="btn primary" data-new="projects">+ Projeto</button>',meetings:'<button class="btn primary" data-meeting-new>+ Importar reunião</button>',receipts:'<button class="btn primary" data-new="receipts">+ Recebimento</button>'})[section]||'';document.querySelectorAll('[data-new]').forEach(b=>b.onclick=()=>edit(b.dataset.new));document.getElementById('content').innerHTML=({dashboard:dashboard,clients:clients,services:services,proposals:proposals,deals:deals,projects:projects,meetings:meetings,emails:emailPage,receipts:receipts,settings:settings})[section]();wire()}
function table(headers,rows,empty='Nenhum registro ainda.'){return rows.length?`<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:`<div class="empty">${empty}</div>`}

};
const settingsBeforeOnline=settings;
settings=function(){let html=settingsBeforeOnline();if(!onlineEnabled())return html;return panel('<h2>Conta online</h2><p>As alterações são enviadas ao banco. Confira o indicador de sincronização antes de fechar.</p><div class="row"><button class="btn" id="onlineLogout" type="button">Sair da conta</button>'+(pendingDraft()?'<button class="btn" id="exportPending" type="button">Baixar alterações pendentes</button>':'')+(onlineBlocked&&pendingDraft()?'<button class="btn" id="useServer" type="button" '+(pendingExported?'':'disabled')+'>Usar versão do servidor</button>':'')+'</div>')+html.replace('O navegador pode apagar os dados ao limpar o armazenamento do site ou ao usar outro perfil. O backup é a sua cópia portátil.','Exporte backups regularmente, mesmo com a sincronização online.').replace('Este arquivo não envia dados pela internet. Os cadastros são gravados no armazenamento local do navegador que abriu o HTML.','Nesta versão, os cadastros são enviados ao banco configurado e associados à sua conta.');};
const wireBeforeOnline=wire;
wire=function(){wireBeforeOnline();let pending=document.getElementById('exportPending');if(pending)pending.onclick=()=>{let draft=pendingDraft();if(draft){exportPending(draft);pendingExported=true;let proceed=document.getElementById('useServer');if(proceed)proceed.disabled=false}};let proceed=document.getElementById('useServer');if(proceed)proceed.onclick=()=>{if(!pendingExported||!confirm('Você guardou o backup? A cópia pendente deste navegador será removida e a versão do servidor será carregada.'))return;localStorage.removeItem(pendingKey());pendingExported=false;onlineBlocked=false;onlineQueue=Promise.resolve();onlinePending=0;onlineLoad()};let button=document.getElementById('onlineLogout');if(button)button.onclick=async()=>{await onlineQueue;if(onlineBlocked){alert('Baixe as alterações pendentes antes de sair da conta.');return}try{await onlineRequest('/auth/v1/logout',{method:'POST'})}catch{}sessionStorage.removeItem('gestao-online-session');onlineSession=null;onlineStatus('');onlineGate('Sessão encerrada. Entre para acessar seus dados.')};};
window.addEventListener('beforeunload',event=>{if(onlineEnabled()&&(onlinePending||onlineBlocked)){event.preventDefault();event.returnValue='';}});
async function startOnline(){
 if(!onlineEnabled()){onlineSetup();return}
 try{onlineSession=JSON.parse(sessionStorage.getItem('gestao-online-session')||'null')}catch{}
 if(!onlineSession){onlineGate();return}
 try{if(onlineSession.expires_at&&Date.now()/1000>onlineSession.expires_at-60)await onlineRefresh();await onlineLoad()}
 catch(err){sessionStorage.removeItem('gestao-online-session');onlineSession=null;onlineGate(err.message)}
}

window.addEventListener('afterprint',()=>{document.getElementById('printRoot').innerHTML='';printing=null});startOnline();
})();
</script></body></html>

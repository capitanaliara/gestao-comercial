function resultsPanel(){
 const now=today(),year=now.slice(0,4),month=now.slice(0,7),start30=(()=>{let d=new Date(now+'T12:00:00');d.setDate(d.getDate()-29);return d.toLocaleDateString('en-CA')})();
 const within=s=>!!s&&(resultsPeriod==='all'||resultsPeriod==='month'&&s.startsWith(month)||resultsPeriod==='year'&&s.startsWith(year)||resultsPeriod==='30'&&s>=start30&&s<=now);
 const approachedDate=d=>d.approachedAt||(d.activities||[]).filter(a=>a.situation==='Primeira abordagem').map(a=>a.day).sort()[0]||'';
 const approached=db.deals.filter(d=>within(approachedDate(d))),answered=approached.filter(d=>d.respondedAt).length;
 const sent=db.proposals.filter(p=>p.status!=='Rascunho'&&within(p.sentAt||p.created));
 const converted=sent.filter(p=>p.status==='Aceita'||db.deals.some(d=>d.proposalId===p.id&&funnelStage(d.stage)==='Fechado')).length;
 const closed=db.deals.filter(d=>funnelStage(d.stage)==='Fechado'&&within(d.closedAt)&&num(d.value)>0);
 const paid=db.receipts.filter(r=>within(r.paidAt)).reduce((a,r)=>a+num(r.amount),0);
 const recurring=db.deals.filter(d=>d.recurringActive&&funnelStage(d.stage)==='Fechado').reduce((a,d)=>a+num(d.monthlyAmount),0);
 const rate=(n,total)=>total?Math.round(n/total*100)+'%':'—';
 const metrics=[['Contatos abordados',approached.length,'Primeiro contato registrado'],['Taxa de resposta',rate(answered,approached.length),answered+' de '+approached.length+' abordados'],['Propostas enviadas',sent.length,'Emissão ou envio no período'],['Conversão em contratos',rate(converted,sent.length),converted+' de '+sent.length+' propostas'],['Ticket médio',closed.length?money(closed.reduce((a,d)=>a+num(d.value),0)/closed.length):'—',closed.length+' contratos fechados no período'],['Valor recebido',money(paid),'Pagamentos confirmados'],['Receita recorrente',money(recurring)+'/mês','Contratos mensais ativos hoje']];
 const card=([label,value,note])=>`<article class="result-metric"><small>${label}</small><strong>${value}</strong><span>${note}</span></article>`;
 return `<section class="results-panel"><div class="results-head"><div><span class="eyebrow">COMERCIAL / RESULTADOS</span><h3>Resultados e metas</h3><p>Do primeiro contato ao dinheiro recebido.</p></div><label>Período<select id="resultsPeriod" aria-label="Período dos resultados"><option value="month" ${resultsPeriod==='month'?'selected':''}>Este mês</option><option value="30" ${resultsPeriod==='30'?'selected':''}>Últimos 30 dias</option><option value="year" ${resultsPeriod==='year'?'selected':''}>Este ano</option><option value="all" ${resultsPeriod==='all'?'selected':''}>Todo o histórico</option></select></label></div><div class="results-grid">${metrics.map(card).join('')}</div><p class="results-caption">Taxa de resposta: retornos registrados entre contatos abordados no período. Conversão: propostas emitidas no período que foram aceitas ou vinculadas a um fechamento. Histórico anterior sem data de abordagem ou fechamento não entra nesses indicadores. Receita recorrente mostra contratos ativos hoje, independente do período.</p></section>`;
}
const dashboardBeforeResults=dashboard;dashboard=function(){return dashboardBeforeResults().replace('<div class="widget-grid">',resultsPanel()+'<div class="widget-grid">')};
const resultsWireBase=wire;wire=function(){resultsWireBase();let sel=document.getElementById('resultsPeriod');if(sel)sel.onchange=()=>{resultsPeriod=sel.value;render()}};
// Online mode is opt-in. The public anon key is safe to embed; never embed a service-role key.
let onlineSession=null,onlineRevision=0,onlineQueue=Promise.resolve(),onlineBlocked=false,onlinePending=0,pendingExported=false;
const pendingKey=()=>onlineSession?.user?.id?'gestao-online-pending-'+onlineSession.user.id:null;
function pendingDraft(){try{return JSON.parse(localStorage.getItem(pendingKey())||'null')}catch{return null}}
function exportPending(draft){let url=URL.createObjectURL(new Blob([JSON.stringify(draft.payload,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='gestao-backup-pendente-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function onlineStatus(message,tone='idle'){let el=document.getElementById('onlineStatus');if(!el){el=document.createElement('div');el.id='onlineStatus';document.body.append(el)}el.textContent=message;el.dataset.tone=tone;el.hidden=!onlineEnabled()||!onlineSession}
const onlineEnabled=()=>Boolean(ONLINE_CONFIG.url&&ONLINE_CONFIG.anonKey);
const onlineUrl=path=>ONLINE_CONFIG.url.replace(/\/$/,'')+path;
async function onlineRequest(path,options={}){
 const headers={'apikey':ONLINE_CONFIG.anonKey,'Content-Type':'application/json',...options.headers};
 if(onlineSession?.access_token)headers.Authorization='Bearer '+onlineSession.access_token;
 const response=await fetch(onlineUrl(path),{...options,headers});
 const raw=await response.text();let data;try{data=raw?JSON.parse(raw):null}catch{data=raw}
 if(!response.ok)throw Error(data?.msg||data?.message||data?.error_description||data?.error||'Falha na conexão ('+response.status+').');
 return data;
}
function onlineSetup(message='Conecte seu projeto Supabase para começar.'){
 document.querySelector('.app').style.display='none';let root=document.getElementById('onlineGate');if(!root){root=document.createElement('div');root.id='onlineGate';document.body.append(root)}
 root.innerHTML='<div class="online-auth"><div class="auth-mark">✳</div><span class="eyebrow">LIRO</span><h1>Conecte seu espaço.</h1><p id="onlineMessage"></p><form id="onlineSetupForm"><label>URL do projeto<input name="url" type="url" placeholder="https://seu-projeto.supabase.co" required></label><label>Chave pública (anon ou publishable)<input name="anonKey" type="text" autocomplete="off" required></label><button class="btn primary">Conectar</button></form><p class="hint">Use somente a chave pública. Nunca cole a chave service_role ou secret.</p></div>';
 root.querySelector('#onlineMessage').textContent=message;
 root.querySelector('form').onsubmit=e=>{e.preventDefault();let data=new FormData(e.target),url=String(data.get('url')||'').trim().replace(/\/$/,''),key=String(data.get('anonKey')||'').trim();
  if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url))return onlineSetup('Confira a URL do projeto Supabase.');
  if(!key||/^(eyJ|sb_publishable_)/.test(key)===false||key.startsWith('sb_secret_'))return onlineSetup('Use apenas a chave pública anon ou publishable.');
  ONLINE_CONFIG.url=url;ONLINE_CONFIG.anonKey=key;localStorage.setItem('gestao-online-config',JSON.stringify(ONLINE_CONFIG));onlineGate();
 };
}
function onlineGate(message='Entre para acessar seus dados.',signup=false,email=''){
 document.querySelector('.app').style.display='none';
 let root=document.getElementById('onlineGate');if(!root){root=document.createElement('div');root.id='onlineGate';document.body.append(root)}
 root.innerHTML='<div class="online-auth"><div class="auth-mark">✳</div><span class="eyebrow">LIRO</span><h1></h1><p id="onlineMessage" role="status"></p><form id="onlineForm"><label>E-mail<input name="email" type="email" autocomplete="username" required></label><label>Senha<input name="password" type="password" autocomplete="'+(signup?'new-password':'current-password')+'" minlength="6" required></label><button class="btn primary" type="submit"></button></form><button class="linkbtn" id="onlineSignup" type="button"></button></div>';
 root.querySelector('h1').textContent=signup?'Crie sua conta.':'Seu espaço comercial.';
 root.querySelector('button[type="submit"]').textContent=signup?'Criar conta':'Entrar';
 root.querySelector('#onlineSignup').textContent=signup?'Já tenho conta · entrar':'Ainda não tenho conta · criar acesso';
 root.querySelector('[name="email"]').value=email;
 root.querySelector('#onlineMessage').textContent=message;
 root.querySelector('#onlineForm').onsubmit=e=>{e.preventDefault();onlineAuthenticate(new FormData(e.target),signup)};
 root.querySelector('#onlineSignup').onclick=()=>onlineGate(signup?'Entre com o e-mail e a senha da conta confirmada.':'Preencha e-mail e uma senha de pelo menos 6 caracteres.',!signup,root.querySelector('[name="email"]').value);
}
async function onlineAuthenticate(form,signup){
 let email=String(form.get('email')||'').trim(),password=String(form.get('password')||'');
 if(!email||password.length<6)return onlineGate('Informe e-mail e senha com pelo menos 6 caracteres.',signup,email);
 try{
  const data=await onlineRequest(signup?'/auth/v1/signup':'/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});
  if(!data.access_token){onlineGate('Cadastro solicitado. Abra o e-mail de confirmação do Supabase, clique no link e depois entre aqui.',false,email);return}
  onlineSession=normalizeOnlineSession(data);sessionStorage.setItem('gestao-online-session',JSON.stringify(onlineSession));await onlineLoad();
 }catch(err){onlineGate(err.message,signup,email)}
}
async function onlineLoad(){
 try{
  const rows=await onlineRequest('/rest/v1/gestao_documents?select=payload,revision',{headers:{Accept:'application/json'}});
  if(!Array.isArray(rows))throw Error('Resposta inválida do banco.');
  onlineRevision=rows[0]?.revision||0;
  db=rows.length?rows[0].payload:fresh();
  if(!valid(db))throw Error('Os dados recebidos não estão no formato esperado.');
  // A conta nova começa vazia; o usuário importa o backup pela tela Configurações.
  db.projects??=[];db.meetings??=[];db.tasks??=[];db.contactLists??=[];db.emailChecks??=[];db.emailJobs??=[];db.goals??={monthlyRevenue:3300,monthlyLeads:20,weeklyTasks:10};
  let draft=pendingDraft();
  if(draft?.payload&&valid(draft.payload)){
   if(draft.baseRevision===onlineRevision){db=draft.payload;onlineStatus('Recuperando alteração pendente','busy');save()}
   else{
    onlineBlocked=true;
    document.getElementById('onlineGate')?.remove();document.querySelector('.app').style.display='';
    render();onlineStatus('Conflito entre dispositivos · baixe o backup','error');
    alert('Há alterações deste navegador que não foram sincronizadas e o servidor também mudou. Em Configurações, exporte o backup pendente antes de decidir qual versão manter.');return;
   }
  }
  document.getElementById('onlineGate')?.remove();document.querySelector('.app').style.display='';
  if(!draft){onlineBlocked=false;onlineStatus('Sincronizado','ok')}render();
 }catch(err){onlineGate('Não foi possível carregar seus dados: '+err.message)}
}
function normalizeOnlineSession(data){
 return {...data,expires_at:data.expires_at||Math.floor(Date.now()/1000)+Number(data.expires_in||3600)};
}
async function onlineRefresh(){
 if(!onlineSession?.refresh_token)throw Error('Sessão expirada. Entre novamente.');
 onlineSession=normalizeOnlineSession(await onlineRequest('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:onlineSession.refresh_token})}));
 sessionStorage.setItem('gestao-online-session',JSON.stringify(onlineSession));
}
const offlineSave=save;
save=function(){
 if(!onlineEnabled())return offlineSave();
 if(onlineBlocked){alert('A sincronização foi interrompida. Exporte um backup antes de recarregar.');return false}
 const snapshot=JSON.parse(JSON.stringify(db));
 const key=pendingKey();
 try{if(!key)throw Error('Sessão sem identificação.');let prior=pendingDraft();localStorage.setItem(key,JSON.stringify({baseRevision:prior?.baseRevision??onlineRevision,payload:snapshot}))}
 catch{alert('Não foi possível guardar uma cópia de emergência. Exporte um backup antes de prosseguir.');return false}
 onlinePending++;onlineStatus('Sincronizando…','busy');
 onlineQueue=onlineQueue.then(async()=>{
  if(onlineBlocked)return;
  if(onlineSession?.expires_at&&Date.now()/1000>onlineSession.expires_at-60)await onlineRefresh();
  const result=await onlineRequest('/rest/v1/rpc/save_gestao_document',{method:'POST',body:JSON.stringify({expected_revision:onlineRevision,next_payload:snapshot})});
  onlineRevision=Number(result);onlinePending--;
  let latest=pendingDraft();if(latest&&key){if(JSON.stringify(latest.payload)===JSON.stringify(snapshot))localStorage.removeItem(key);else{latest.baseRevision=onlineRevision;localStorage.setItem(key,JSON.stringify(latest))}}
  if(!onlinePending)onlineStatus('Sincronizado','ok');
 }).catch(err=>{
  onlineBlocked=true;onlineStatus('Falha ao sincronizar · exporte um backup','error');
  alert('Não foi possível sincronizar. Seus dados desta sessão ainda estão na tela. Exporte um backup em Configurações antes de fechar. Detalhe: '+err.message);
  return null;
 });
 // The existing UI expects a synchronous return; the queue reports remote errors explicitly.
 return true;
};
const settingsBeforeOnline=settings;
settings=function(){let html=settingsBeforeOnline();if(!onlineEnabled())return html;return panel('<h2>Conta online</h2><p>As alterações são enviadas ao banco. Confira o indicador de sincronização antes de fechar.</p><div class="row"><button class="btn" id="onlineLogout" type="button">Sair da conta</button>'+(pendingDraft()?'<button class="btn" id="exportPending" type="button">Baixar alterações pendentes</button>':'')+(onlineBlocked&&pendingDraft()?'<button class="btn" id="useServer" type="button" '+(pendingExported?'':'disabled')+'>Usar versão do servidor</button>':'')+'</div>')+html.replace('O navegador pode apagar os dados ao limpar o armazenamento do site ou ao usar outro perfil. O backup é a sua cópia portátil.','Exporte backups regularmente, mesmo com a sincronização online.').replace('Este arquivo não envia dados pela internet. Os cadastros são gravados no armazenamento local do navegador que abriu o HTML.','Nesta versão, os cadastros são enviados ao banco configurado e associados à sua conta.');};
const wireBeforeOnline=wire;
wire=function(){wireBeforeOnline();let pending=document.getElementById('exportPending');if(pending)pending.onclick=()=>{let draft=pendingDraft();if(draft){exportPending(draft);pendingExported=true;let proceed=document.getElementById('useServer');if(proceed)proceed.disabled=false}};let proceed=document.getElementById('useServer');if(proceed)proceed.onclick=()=>{if(!pendingExported||!confirm('Você guardou o backup? A cópia pendente deste navegador será removida e a versão do servidor será carregada.'))return;localStorage.removeItem(pendingKey());pendingExported=false;onlineBlocked=false;onlineQueue=Promise.resolve();onlinePending=0;onlineLoad()};let button=document.getElementById('onlineLogout');if(button)button.onclick=async()=>{await onlineQueue;if(onlineBlocked){alert('Baixe as alterações pendentes antes de sair da conta.');return}try{await onlineRequest('/auth/v1/logout',{method:'POST'})}catch{}sessionStorage.removeItem('gestao-online-session');onlineSession=null;onlineStatus('');onlineGate('Sessão encerrada. Entre para acessar seus dados.')};};
window.addEventListener('beforeunload',event=>{if(onlineEnabled()&&(onlinePending||onlineBlocked)){event.preventDefault();event.returnValue='';}});
async function startOnline(){
 if(!onlineEnabled()){onlineSetup();return}
 try{onlineSession=JSON.parse(sessionStorage.getItem('gestao-online-session')||'null')}catch{}
 if(!onlineSession){onlineGate();return}
 try{if(!onlineSession.expires_at||Date.now()/1000>onlineSession.expires_at-60)await onlineRefresh();await onlineLoad()}
 catch(err){sessionStorage.removeItem('gestao-online-session');onlineSession=null;onlineGate(err.message)}
}

window.addEventListener('afterprint',()=>{document.getElementById('printRoot').innerHTML='';printing=null});startOnline();
})();
</script></body></html>
